name: Release

on:
  push:
    tags: ["v*"]

# Deliberately NO concurrency block here, and not cancel-in-progress: false
# either. A tag is unique, so a group keyed on the ref would never collapse
# anything; a group keyed on the workflow would cancel a PENDING release
# whenever a third tag arrived, because by default GitHub holds one pending run
# per group regardless of the flag. A release run cancelled mid-publish is
# the one failure a concurrency group must not be allowed to create.

jobs:
  release:
    runs-on: ubuntu-latest
    # Measured 0.1–0.2 min. The one thing that can hang is the release API
    # call, and the default is six hours.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The release body is the CHANGELOG entry, not `--generate-notes`.
      # Auto-generation lists merged PR titles plus a compare link, which for
      # v0.7.0 — a release that renamed every path the plugin owns on disk and
      # broke project-level config — came to a single line, while the changelog
      # carried ninety. The changelog is written deliberately and reviewed in
      # the PR that ships it; this makes it the thing users actually read.
      #
      # The extractor exits non-zero when the section is missing or empty, and
      # that failure is wanted: a tag pushed without a changelog entry should
      # fail the release rather than publish blank notes. Re-run after adding
      # the section — the tag does not need to move.
      - name: Build release notes from CHANGELOG
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
