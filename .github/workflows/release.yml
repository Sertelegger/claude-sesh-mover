name: Release

on:
  push:
    tags: ["v*"]

# Deliberately NO concurrency block here, and not cancel-in-progress: false
# either. A tag is unique, so a group keyed on the ref would never collapse
# anything; a group keyed on the workflow would cancel a PENDING release
# whenever a third tag arrived, because by default GitHub holds one pending run
# per group regardless of the flag. A release run cancelled mid-publish is
# the one failure a concurrency group must not be allowed to create.

jobs:
  release:
    runs-on: ubuntu-latest
    # Measured 0.1–0.2 min. The one thing that can hang is the release API
    # call, and the default is six hours.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Nothing else compares the tag with the version the build carries.
      # `PLUGIN_VERSION` is what `--version` prints and what `registerMachine`
      # stamps into `machines/<id>.json` on a shared hub, and
      # `tests/version.test.ts` pins it to package.json — so a tag that does
      # not match package.json publishes a release whose code says it is some
      # other version. Fail before anything is published.
      - name: Check the tag matches package.json
        run: |
          node -e '
            const v = require("./package.json").version;
            if (process.env.GITHUB_REF_NAME !== "v" + v) {
              console.error("tag " + process.env.GITHUB_REF_NAME + " does not match package.json version v" + v);
              process.exit(1);
            }
          '
      # The release body is the CHANGELOG entry, not `--generate-notes`.
      # Auto-generation lists merged PR titles plus a compare link, which for
      # v0.7.0 — a release that renamed every path the plugin owns on disk and
      # broke project-level config — came to a single line, while the changelog
      # carried ninety. The changelog is written deliberately and reviewed in
      # the PR that ships it; this makes it the thing users actually read.
      #
      # The extractor exits non-zero when the section is missing or empty, and
      # that failure is wanted: a tag pushed without a changelog entry should
      # fail the release rather than publish blank notes.
      #
      # Recovering from that failure: a re-run does NOT see a section added
      # afterwards, because a re-run reuses the original event's GITHUB_SHA and
      # GITHUB_REF — it checks out the tagged commit again. Either move the tag
      # to a commit that has the section, or create the release by hand from a
      # checkout that has it:
      #   gh release create "$TAG" --verify-tag --title "$TAG" \
      #     --notes-file <(node scripts/changelog-section.mjs "$TAG")
      - name: Build release notes from CHANGELOG
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
