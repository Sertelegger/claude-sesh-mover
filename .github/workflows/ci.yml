name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The age binary is the DIFFERENTIAL ORACLE for src/crypto/age.ts, and
      # without it the most important test in that module skips.
      #
      # This is not belt-and-braces. Four of the injected defects — a frozen
      # nonce counter, a little-endian counter, an empty trailing chunk, and a
      # one-character HKDF info typo — round-trip through our own code
      # PERFECTLY, so a self-round-trip test is green while the file reuses one
      # nonce across every chunk. Only a second implementation catches them, and
      # nonce reuse is catastrophic and silent.
      #
      # SESH_MOVER_REQUIRE_AGE turns the skip into a hard failure, so a runner
      # that loses the binary fails loudly instead of quietly dropping the
      # coverage. Linux only: apt is the cheap install, and one oracle running
      # everywhere the code is identical is the point — the platform matrix is
      # for platform behaviour, and this test is about the wire format.
      - name: Install the age oracle (differential test for src/crypto)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y age
      - run: npm run lint
      - run: npm run build
      - name: dist freshness (committed dist/ must match src/)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale — run 'npm run build' and commit dist/"
            exit 1
          fi
      - run: npm test
        env:
          # Only where the oracle was installed; elsewhere the skip is correct.
          SESH_MOVER_REQUIRE_AGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  windows-smoke:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Set up smoke fixture
        run: node scripts/ci-smoke-setup.mjs
      - name: Round-trip via PowerShell
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "smoke-config/.claude"
          $out = node dist/cli.js export --scope all --storage project --format dir --name "smoke export pwsh" --source-config-dir "$config" --project-path "/Users/testuser/Projects/testproject" --no-summary
          $result = $out | ConvertFrom-Json
          if (-not $result.success) { Write-Error "export failed: $out"; exit 1 }
          $target = Join-Path $env:RUNNER_TEMP "smoke-target-pwsh"
          $targetConfig = Join-Path $env:RUNNER_TEMP "smoke-config-pwsh/.claude"
          $out2 = node dist/cli.js import --from "$($result.exportPath)" --target-project-path "$target" --target-config-dir "$targetConfig"
          $import = $out2 | ConvertFrom-Json
          if (-not $import.success) { Write-Error "import failed: $out2"; exit 1 }
          if ($import.importedSessions.Count -ne 1) { Write-Error "expected 1 imported session: $out2"; exit 1 }
      - name: Round-trip via Git Bash
        shell: bash
        # Git Bash's MSYS runtime auto-converts any argv string that looks
        # like a POSIX absolute path (e.g. "/Users/testuser/...") into a
        # Windows path before exec'ing a non-MSYS binary like node.exe. Our
        # --project-path here is an opaque identifier (the fixture's
        # recorded cwd), not a real filesystem path on this runner, and must
        # reach the CLI byte-for-byte or discovery.ts won't find the
        # matching project folder. Disable that conversion for this step.
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/smoke-config/.claude"
          out=$(node dist/cli.js export --scope all --storage project --format dir --name "smoke export bash" --source-config-dir "$config" --project-path "/Users/testuser/Projects/testproject" --no-summary)
          echo "$out"
          echo "$out" | jq -e '.success == true' >/dev/null
          export_path=$(echo "$out" | jq -r '.exportPath')
          out2=$(node dist/cli.js import --from "$export_path" --target-project-path "$RUNNER_TEMP/smoke-target-bash" --target-config-dir "$RUNNER_TEMP/smoke-config-bash/.claude")
          echo "$out2"
          echo "$out2" | jq -e '.success == true' >/dev/null
          echo "$out2" | jq -e '.importedSessions | length == 1' >/dev/null
